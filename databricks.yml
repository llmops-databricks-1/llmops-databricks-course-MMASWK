# This is a Databricks asset bundle definition for llmops_databricks_course_MMASWK.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: llmops-databricks-course-MMASWK

include:
  - resources/*.yml

variables:
  git_sha:
    description: "Git SHA of the deployed commit"
    default: "local"

artifacts:
  default:
    type: whl
    build: uv build
    path: .

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-b1b2f91a-d102.cloud.databricks.com/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
