# Project Configuration for LLMOps Course

# Development environment
dev:
  catalog: llmops_dev
  schema: mdpi
  volume: mdpi_files
  llm_endpoint: databricks-llama-4-maverick
  embedding_endpoint: databricks-gte-large-en
  warehouse_id: 0
  vector_search_endpoint: endpoint
  genie_space_id: 0

# Acceptance/Staging environment
acc:
  catalog: llmops_dev
  schema: mdpi
  volume: mdpi_files
  llm_endpoint: databricks-meta-llama-3-1-70b-instruct
  embedding_endpoint: databricks-gte-large-en
  warehouse_id: 0
  vector_search_endpoint: endpoint
  genie_space_id: 0

# Production environment
prd:
  catalog: llmops_dev
  schema: mdpi
  volume: mdpi_files
  llm_endpoint: databricks-meta-llama-3-1-70b-instruct
  embedding_endpoint: databricks-gte-large-en
  warehouse_id: 0
  vector_search_endpoint: endpoint
  genie_space_id: 0

# Model configuration
model_config:
  temperature: 0.7
  max_tokens: 2000
  top_p: 0.95

# Vector search configuration
vector_search:
  embedding_dimension: 1024
  similarity_metric: cosine
  num_results: 5

# Chunking configuration
chunking:
  chunk_size: 512
  chunk_overlap: 50
  separator: "\n\n"
